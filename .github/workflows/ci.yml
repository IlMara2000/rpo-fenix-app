name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifica:
    name: Typecheck, test e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versione di Node arriva da .nvmrc: quella locale e quella della CI
      # non possono piu' scollarsi.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Anche Python viene dal repo (.python-version), come Node da .nvmrc:
      # la versione della CI non può scollarsi da quella locale.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Installa le dipendenze
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # server/security.py e server/uploads.py usano solo la stdlib, quindi qui
      # non serve installare requirements.txt (pandas e openpyxl sono per gli
      # script, non per i test).
      - name: Test Python
        run: npm run test:py

      - name: Build
        run: npm run build
